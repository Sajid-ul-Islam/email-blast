<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Blast — Sign in</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container container-narrow">
    <header>
      <h1>📧 Email Blast</h1>
      <p class="subtitle">Sign in to manage campaigns.</p>
    </header>

    <section class="card login-card">
      <h2>Sign in</h2>
      {% if error %}
      <p class="error-box">{{ error }}</p>
      {% endif %}
      <form method="post" action="/login{% if request.args.get('next') %}?next={{ request.args.get('next') | urlencode }}{% endif %}" class="login-form">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" class="input" value="{{ username }}" autocomplete="username" autofocus>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" class="input" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Sign in →</button>
      </form>
    </section>
  </div>
</body>
</html>
